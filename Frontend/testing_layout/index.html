<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Test</title>

    <!-- leaflet css -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map{
            width: 100;
            height: 98vh;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    
</body>
</html>

<!-- leaflet js -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    //Initialize Map
    var map = L.map('map').setView([43.63, -79.39], 13);

    //OSM layer
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });
    osm.addTo(map);

    //CartoDB
    var CartoDB_VoyagerLabelsUnder = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
    });
    CartoDB_VoyagerLabelsUnder.addTo(map)
    
    //Create Real-time location feature
    if(!navigator.geolocation) {
        print("your browser doesnt support geolocation feature ")
    } else {
        setInterval(() => {
            navigator.geolocation.getCurrentPosition(getPosition)
        }, 5000);
        
    }
    var marker, circle;

    function getPosition(position) {
        
        var lat = position.coords.latitude
        var lon = position.coords.longitude
        var accuracy = position.coords.accuracy

        if (marker){
            map.removeLayer(marker)
        }
        if (circle){
            map.removeLayer(circle)
        }
        marker = L.marker([lat,lon])
        circle = L.circle([lat,lon], {radius:accuracy})
        var featureGroup = L.featureGroup([marker,circle]).addTo(map)

        map.fitBounds(featureGroup.getBounds())
        console.log("Your coords are: Lat: " +lat +"Long: " +lon +"Accuracy: " +accuracy)
    }

</script>
